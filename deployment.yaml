apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcheck-app
  template:
    metadata:
      labels:
        app: healthcheck-app
    spec:
      containers:
        - name: healthcheck-app
          image: docker.io/library/healthcheck-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080