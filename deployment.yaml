apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcheck-app
  template:
    metadata:
      labels:
        app: healthcheck-app
    spec:
      containers:
        - name: healthcheck-app
          image: 851725234293.dkr.ecr.eu-west-1.amazonaws.com/healthcheck-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080